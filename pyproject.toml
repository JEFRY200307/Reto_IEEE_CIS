[project]
name = "dsqa"
version = "0.1.0"
description = "QA de dominio con recuperación e Inteligencia Computacional (IEEE CIS DSQA Challenge 2026)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src", "eval", "."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "eval", "offline", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP007"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
files = ["src/dsqa"]
